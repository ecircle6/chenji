# =============================================================================
# CI：每次 push 到 main / PR 自动运行单元测试 + 构建 Debug 包
# 参考 JeffGu98 流水线设计；与 docs-sync-check.yml 并行互不影响
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: 单测 + Debug 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 修复 gradlew 可执行权限（Windows 入库的脚本可能无 exec 位）
        run: chmod +x gradlew

      # 临时诊断：定位 KSP 插件解析失败是哪个仓库不可达（验证后移除）
      - name: 诊断仓库可达性
        run: |
          for url in \
            "https://maven.aliyun.com/repository/gradle-plugin/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.21-1.0.28/com.google.devtools.ksp.gradle.plugin-2.0.21-1.0.28.pom" \
            "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.21-1.0.28/com.google.devtools.ksp.gradle.plugin-2.0.21-1.0.28.pom" \
            "https://dl.google.com/dl/android/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.21-1.0.28/com.google.devtools.ksp.gradle.plugin-2.0.21-1.0.28.pom" \
            "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.21-1.0.28/com.google.devtools.ksp.gradle.plugin-2.0.21-1.0.28.pom"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "ERR")
            echo "HTTP $code <- $url"
          done
          exit 0

      - name: 运行单元测试（农历/备份/筛选/事件计算，共 5 个测试类）
        run: ./gradlew testDebugUnitTest

      - name: 构建 Debug 包
        run: ./gradlew assembleDebug

      - name: 上传 Debug APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
