# =============================================================================
# Release：打 v* tag 时自动签名构建正式包并发布 GitHub Release
#
# 签名密钥通过 repo Secrets 注入（不入版本库）：
#   KEYSTORE_BASE64  签名文件 birthapp-release.jks 的 base64 内容
#   STORE_PASSWORD   storePassword
#   KEY_ALIAS        keyAlias
#   KEY_PASSWORD     keyPassword
#
# 若 Secrets 未配置：跳过签名与发布（构建未签名 release 用于验证），不报错。
# 发布流程：git tag v2.2.0 && git push origin v2.2.0
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 GitHub Release 所需

jobs:
  release:
    name: 签名构建 + 发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 修复 gradlew 可执行权限
        run: chmod +x gradlew

      - name: 还原签名密钥（Secrets → keystore.properties + jks）
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "⚠ 签名 Secrets 未配置齐全，本次构建未签名 release（不发布）"
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > birthapp-release.jks
            cat > keystore.properties <<EOF
            storeFile=birthapp-release.jks
            storePassword=$STORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建签名 Release 包
        run: ./gradlew assembleRelease

      - name: 发布 GitHub Release（含 APK 与自动生成发布说明）
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
